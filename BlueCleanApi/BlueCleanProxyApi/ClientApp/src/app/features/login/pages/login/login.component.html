<section aria-labelledby="login-title">
  <h2 id="login-title">{{ titulo }}</h2>
  <p>{{ subtitulo }}</p>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="field">
      <label for="identificador">E-mail ou CPF/CNPJ</label>
      <input
        id="identificador"
        type="text"
        formControlName="identificador"
        autocomplete="username"
      />

      @if (fieldError('identificador'); as error) {
        <p class="field-error" role="alert">{{ error }}</p>
      }
    </div>

    <div class="field">
      <label for="senha">Senha</label>
      <input
        id="senha"
        type="password"
        formControlName="senha"
        autocomplete="current-password"
      />

      @if (fieldError('senha'); as error) {
        <p class="field-error" role="alert">{{ error }}</p>
      }
    </div>

    @if (apiErrors().length > 0) {
      <ul class="api-errors" aria-live="polite">
        @for (message of apiErrors(); track message) {
          <li>{{ message }}</li>
        }
      </ul>
    }

    <div class="actions">
      <button type="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Entrando...' : 'Entrar' }}
      </button>
      <a [routerLink]="rotaAlternativa">{{ textoAlternativa }}</a>
    </div>
  </form>
</section>
