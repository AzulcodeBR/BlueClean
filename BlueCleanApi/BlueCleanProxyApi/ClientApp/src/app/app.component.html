<a class="skip-link" href="#main-content">Pular para o conteudo principal</a>

@if (isLoading()) {
  <div class="loading-overlay" aria-live="polite" aria-busy="true" role="status">
    <img
      ngSrc="/images/logos/logoLoading.png"
      width="160"
      height="160"
      alt="Carregando"
      class="loading-logo"
    />
  </div>
}

<div class="app-shell">
  <header class="app-header">
    <div class="brand">
      <img
        ngSrc="/images/logos/LogoColorido.png"
        width="192"
        height="192"
        alt="Logo BlueClean"
        class="brand-logo"
      />
      <div class="brand-text">
        <h1 class="brand-title">{{ title() }}</h1>
        <p class="brand-subtitle">Estrutura inicial do frontend</p>
      </div>
    </div>

    <nav aria-label="Navegacao principal">
      <ul class="nav-list">
        @for (item of navItems; track item.path) {
          <li>
            <a
              [routerLink]="item.path"
              routerLinkActive="is-active"
              [routerLinkActiveOptions]="{ exact: item.path === '/' }"
            >
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </nav>
  </header>

  <main id="main-content" tabindex="-1">
    <router-outlet />
  </main>
</div>
